<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>本地视频预览</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #111827; color: #f9fafb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 760px); }
    h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 5vw, 2rem); }
    p { color: #cbd5e1; }
    video { display: block; width: 100%; max-height: 70vh; margin-top: 20px; background: #030712; border-radius: 14px; }
    .picker { display: inline-flex; min-height: 44px; align-items: center; padding: 0 16px; border-radius: 999px; background: #34d399; color: #052e2b; font-weight: 700; cursor: pointer; }
    input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
    input:focus-visible + .picker { outline: 3px solid white; outline-offset: 3px; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>本地视频预览</h1>
    <p>选择设备中的视频即可预览。视频只在本机播放，不会上传。</p>
    <input id="file" type="file" accept="video/*" aria-label="选择本地视频">
    <label class="picker" for="file">选择视频</label>
    <p id="status" role="status" aria-live="polite">尚未选择视频</p>
    <video id="player" controls playsinline preload="metadata" hidden aria-label="本地视频播放器"></video>
  </main>
  <script>
    const input = document.querySelector('#file');
    const player = document.querySelector('#player');
    const status = document.querySelector('#status');
    let objectUrl;
    input.addEventListener('change', () => {
      const file = input.files?.[0];
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = undefined;
      player.removeAttribute('src');
      player.hidden = true;
      if (!file) {
        status.textContent = '尚未选择视频';
        return;
      }
      if (!file.type.startsWith('video/')) {
        input.value = '';
        status.textContent = '该文件不是可识别的视频，请重新选择。';
        return;
      }
      objectUrl = URL.createObjectURL(file);
      player.src = objectUrl;
      player.hidden = false;
      status.textContent = `${file.name} · ${(file.size / 1024 / 1024).toFixed(1)} MB`;
    });
    window.addEventListener('pagehide', () => {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
    });
  </script>
</body>
</html>
